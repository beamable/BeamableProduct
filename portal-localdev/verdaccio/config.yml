storage: /verdaccio/storage
auth:
  htpasswd:
    file: /verdaccio/conf/htpasswd
    # -1 means no limit, allows unauthenticated publish for local dev
    max_users: -1

uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    # How long a package's version list from npmjs is trusted; short, so a new dev or rc build shows up quickly
    # through local-unpkg.
    maxage: 30s

packages:
  '@beamable/*':
    access: $all
    publish: $all
    # Local builds have a version of their own (<next minor>-0.<timestamp>) that npmjs never has, so a publish
    # can't collide with the uplink, and nothing is ever unpublished. The uplink is what lets local-unpkg serve the
    # published versions too.
    proxy: npmjs

  '**':
    access: $all
    publish: $all
    proxy: npmjs

server:
  keepAliveTimeout: 60

logs:
  - { type: stdout, format: pretty, level: http }
