name: Build Dev Otel Collector

# Builds the 0.0.123 collector that PR builds install through setup.sh. The binaries are cached by a
# hash of the collector sources, so Go only runs when the collector changes. Pushes to main seed the
# cache, because caches saved by pull_request runs are visible only to that pull request.
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    paths:
      - 'otel-collector/**'
      - '.github/workflows/buildDevOtelCollector.yml'

env:
  GO_VERSION: 1.24.1

jobs:
  buildCollector:
    name: Build Otel Collector
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Restore collector binaries
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/otel-collector
          key: otel-collector-0.0.123-go${{ env.GO_VERSION }}-${{ hashFiles('otel-collector/**') }}
      - name: Install Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ./otel-collector/beamable-collector/go.sum
      - name: Build collector
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ./otel-collector
        shell: bash
        run: OUTPUT_DIRECTORY="$RUNNER_TEMP/otel-collector" ./build.sh --version 0.0.123
      - name: Archive collector
        shell: bash
        run: tar -czf "$RUNNER_TEMP/otel-collector.tar.gz" -C "$RUNNER_TEMP/otel-collector" .
      - uses: actions/upload-artifact@v6
        with:
          name: otel-collector-0.0.123
          path: ${{ runner.temp }}/otel-collector.tar.gz
          if-no-files-found: error
          retention-days: 1
