name: Release Unity SDK

on:
  workflow_dispatch:
    inputs:
      commit:
        type: string
        description: Commit hash to deploy
        default: main
      major:
        type: number
        description: Major version number, X.0.0
        required: true
        default: 0
      minor:
        type: number
        description: Minor version number, 0.X.0
        required: true
        default: 0
      patch:
        type: number
        description: Patch version number, 0.0.X
        required: true
        default: 0
      rcNumber:
        type: number
        description: Rc version number, if required, 0.0.0-PREVIEW.RCX
        required: false
        default: 0
      releaseType:
        type: choice
        description: What type of release is this?
        required: true
        options:
          - nightly
          - rc
          - exp
          - production
      dryRun:
        type: boolean
        description: When true, no publish will happen
        required: true
        default: false

run-name: Release ${{ inputs.releaseType }} ${{ inputs.major }}.${{ inputs.minor }}.${{ inputs.patch }}.${{ inputs.rcNumber }} by @${{ github.actor }}
env:
  DOCKER_REGISTRY: ghcr.io
jobs:
  package:
    name: Build and Publish the Beamable Unity SDK Package
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: read
      issues: write
    concurrency:
      group: release-unity-sdk
      cancel-in-progress: true
    strategy:
      matrix:
        unityVersion:
          - 6000.3.0f1
    env:
      GAME_CI_VERSION: >-
        ${{ fromJSON('{"6000.2.8f1": "3.2.0", "6000.3.0f1": "3.2.1"}')[matrix.unityVersion] || '3.1.0' }}
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: review options
        run: |
          echo dryRun=${{ inputs.dryRun }}
          echo commit=${{ inputs.commit }}
          echo major=${{ inputs.major }}
          echo minor=${{ inputs.minor }}
          echo patch=${{ inputs.patch }}
          echo rc=${{ inputs.rcNumber }}
          echo releaseType=${{ inputs.releaseType }}

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        # Pinned to 11.16.0 (last-known-good): npm 11.17.0 attempts OIDC trusted
        # publishing, which Nexus 2 rejects (token-exchange 404 then PUT 400),
        # breaking the UPM publish to nexus.beamable.com. ~Claude
        run: npm install -g npm@11.16.0
      - name: Check Npm version
        run: npm --version

      - name: Install JQ
        run: |
          sudo apt-get update
          sudo apt-get install jq
          jq --version

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.24.1
          cache-dependency-path: ./otel-collector/beamable-collector/go.sum

      - name: Build Otel Collector
        working-directory: ./otel-collector
        run: |
          OUTPUT_DIRECTORY="$(pwd)/../otel-bin" bash ./build.sh

      - name: Add collector version
        run: |
            sh ./build/bin/set-collector-version-property.sh

      - name: Install CLI
        working-directory: ./
        # The Unity SDK pins a CLI/Nuget version in versions-default.json. When that
        # version is the local dev version (0.0.123.x), build the CLI from source via
        # setup.sh/dev.sh. For any other (released) version, install that exact
        # published Beamable.Tools instead. ~Claude
        run: |
          CLI_VERSION=$(jq -r .nugetPackageVersion client/Packages/com.beamable/Runtime/Environment/Resources/versions-default.json)
          echo "Pinned CLI version: $CLI_VERSION"
          case "$CLI_VERSION" in
            0.0.123*)
              echo "Local dev version detected; building CLI from source."
              bash ./setup.sh
              bash ./dev.sh
              ;;
            *)
              echo "Released version detected; installing Beamable.Tools $CLI_VERSION."
              dotnet tool install Beamable.Tools --version "$CLI_VERSION" --global
              echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
              ;;
          esac
          ls ./client/Packages/com.beamable/Editor/BeamCli/Commands/

      - name: Check CLI
        run: beam version

      - name: Get Version Number (Nightly)
        if: ${{ inputs.releaseType == 'nightly' }}
        run: beam version construct 0 0 0 --nightly > version.txt

      - name: Get Version Number (RC)
        if: ${{ inputs.releaseType == 'rc' }}
        run: beam version construct ${{ inputs.major }} ${{ inputs.minor }} ${{ inputs.patch }} --rc ${{ inputs.rcNumber }} > version.txt

      - name: Get Version Number (Exp)
        if: ${{ inputs.releaseType == 'exp' }}
        run: beam version construct ${{ inputs.major }} ${{ inputs.minor }} ${{ inputs.patch }} --exp ${{ inputs.rcNumber }} > version.txt

      - name: Get Version Number (Prod)
        if: ${{ inputs.releaseType == 'production' }}
        run: beam version construct ${{ inputs.major }} ${{ inputs.minor }} ${{ inputs.patch }} --prod > version.txt

      - name: Store version number as output
        id: version
        env:
          NPM_TAG: >-
            ${{ fromJson('{
              "nightly": "--tag nightly",
              "rc": "--tag rc",
              "exp": "--tag exp",
              "production": ""
            }')[github.event.inputs.releaseType] }}
          NEXUS_REG: >-
            ${{ fromJson('{
              "nightly": "https://nexus.beamable.com/nexus/content/repositories/unity-dev",
              "rc": "https://nexus.beamable.com/nexus/content/repositories/unity-preview",
              "exp": "https://nexus.beamable.com/nexus/content/repositories/unity-preview",
              "production": "https://nexus.beamable.com/nexus/content/repositories/unity"
            }')[github.event.inputs.releaseType] }}
          BUILD_ENV: >-
            ${{ fromJson('{
              "nightly": "dev",
              "rc": "staging",
              "exp": "staging",
              "production": "prod"
            }')[github.event.inputs.releaseType] }}
        run: |
          echo "VERSION=$(cat version.txt | jq -r .data.versionString)" >> "$GITHUB_OUTPUT"
          echo "VERSION_PREFIX=$(cat version.txt | jq -r .data.versionPrefix)" >> "$GITHUB_OUTPUT"
          echo "VERSION_SUFFIX=$(cat version.txt | jq -r .data.versionSuffix)" >> "$GITHUB_OUTPUT"
          echo "BUILD_ENV=$BUILD_ENV" >> "$GITHUB_OUTPUT"
          echo "NEXUS_REG=$NEXUS_REG" >> "$GITHUB_OUTPUT"
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_OUTPUT"

      - name: review version
        run: |
          echo version=${{ steps.version.outputs.VERSION }}
          echo version prefix=${{ steps.version.outputs.VERSION_PREFIX }}
          echo version suffix=${{ steps.version.outputs.VERSION_SUFFIX }}
          echo build-env=${{steps.version.outputs.BUILD_ENV}}
          echo nexus-reg=${{steps.version.outputs.NEXUS_REG}}
          echo npm-tag=${{steps.version.outputs.NPM_TAG}}

      - name: Prepare Unity Env
        run: sh ./build/bin/modify-unity-files.sh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          ENVIRONMENT: ${{steps.version.outputs.BUILD_ENV}}

      - name: Apply Nuget Version to Unity SDK
        run: |
          beam unity download-all-nuget-packages ./client --logs v

      # Unity ignores any directory that has no sibling .meta file, and an installed UPM package is
      # immutable, so a package published with missing folder metas cannot be repaired on the consumer
      # side. Fail the build here instead. ~Claude
      - name: Verify Unity Package Meta Files
        run: |
          beam unity verify-package-metas ./client/Packages/com.beamable

      - name: Prepare Unity Samples
        run: sh ./../../../build/bin/prepare-samples.sh
        working-directory: ./client/Packages/com.beamable/

      - name: Update UPM Versions (com.beamable)
        run: npm version ${{ steps.version.outputs.VERSION }}
        working-directory: ./client/Packages/com.beamable/
        env:
          NPM_REGISTRY: https://registry.npmjs.org

      - name: Update UPM Version (com.beamable.server)
        run: npm version ${{ steps.version.outputs.VERSION }}
        working-directory: ./client/Packages/com.beamable.server/
        env:
          NPM_REGISTRY: https://registry.npmjs.org

      - name: Normalize line endings
        shell: bash
        run: ./build/bin/fix-line-endings.sh client/Packages/com.beamable

      - name: Review Unity SDK Files
        run: |
          ls ./client/Packages/com.beamable/Runtime/Environment/Resources
          cat client/Packages/com.beamable/Runtime/Environment/Resources/env-default.json
          cat client/Packages/com.beamable.server/package.json
          ls ./client/Packages/com.beamable
          ls ./client/Packages/com.beamable/Samples~
          cat client/Packages/com.beamable/package.json

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: game-ci/unity-builder@v4
        timeout-minutes: 60
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          DOTNET_CLI_UI_LANGUAGE: en
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        with:
          customImage: ${{ env.DOCKER_REGISTRY }}/beamable/editor:ubuntu-${{ matrix.unityVersion }}-base-${{ env.GAME_CI_VERSION }}
          customParameters: -beamableOrgId ${{ secrets.BEAMABLE_UNITY_ORG_ID }} -username ${{ secrets.UNITY_EMAIL }} -password ${{ secrets.UNITY_PASSWORD }} -cloudOrganization ${{ secrets.BEAMABLE_UNITY_ORG_ID }} -upmPack client/Packages/com.beamable client/build/package_dist/com.beamable
          gitPrivateToken: ${{ secrets.GITHUB_TOKEN }}
          unityVersion: ${{ matrix.unityVersion }}
          projectPath: client
          allowDirtyBuild: true
          versioning: Custom
          version: ${{ steps.version.outputs.VERSION }}

      - name: Review Output
        run: |
          ls -Ra client/build/package_dist
          file client/build/package_dist/com.beamable

      - name: Fix permissions
        run: |
          sudo chown -R $USER:$USER client/build

      - name: Copy npmRC over
        run: cp client/Packages/com.beamable/.npmrc ./client/build/package_dist/.npmrc

      # The Free Disk Space step above deletes /usr/share/dotnet to make room for the Unity build,
      # which would leave the globally installed `beam` tool with no runtime to run on.
      - name: Restore .NET for the tarball audit
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Last gate before anything leaves the runner: audit the tarball that is actually about to be
      # published, not just the working tree it was built from. ~Claude
      - name: Verify Packaged Tarball Meta Files
        run: |
          rm -rf ./tarball-audit
          mkdir -p ./tarball-audit
          tar -xzf ./client/build/package_dist/com.beamable/com.beamable-${{ steps.version.outputs.VERSION }}.tgz -C ./tarball-audit
          beam unity verify-package-metas ./tarball-audit/package
          rm -rf ./tarball-audit

      - name: Release com.beamable UPM Package to Nexus
        if: ${{ inputs.dryRun == false }}
        run: npm publish ./com.beamable/com.beamable-${{ steps.version.outputs.VERSION }}.tgz ${{steps.version.outputs.NPM_TAG}}
        working-directory: ./client/build/package_dist/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NEXUS_NPM_AUTH }}
          NPM_AUTH: ${{secrets.NEXUS_NPM_AUTH}}
          NPM_REGISTRY: ${{steps.version.outputs.NEXUS_REG}}

      - name: Release com.beamable UPM Package to Public
        if: ${{ inputs.dryRun == false }}
        run: npm publish ./com.beamable/com.beamable-${{ steps.version.outputs.VERSION }}.tgz ${{steps.version.outputs.NPM_TAG}}
        working-directory: ./client/build/package_dist/
        env:
          NPM_REGISTRY: https://registry.npmjs.org

      - name: Release com.beamable.server UPM Package
        if: ${{ inputs.dryRun == false }}
        run: npm publish ${{steps.version.outputs.NPM_TAG}}
        working-directory: ./client/Packages/com.beamable.server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NEXUS_NPM_AUTH }}
          NPM_AUTH: ${{secrets.NEXUS_NPM_AUTH}}
          NPM_REGISTRY: ${{steps.version.outputs.NEXUS_REG}}

      - name: Publish Changelog
        if: ${{ inputs.dryRun == false }}
        run: sh ./build/bin/upload-changelogs.sh
        env:
          COPY_UNITY_SDK: 'true'
          COPY_CLI: 'false'
          COPY_WEB_SDK: 'false'
          VERSION: ${{ steps.version.outputs.VERSION }}
          GITHUB_USERNAME: ${{ secrets.GIT_CHANGELOGS_USERNAME }}
          GITHUB_PASSWORD: ${{ secrets.GIT_CHANGELOGS_PASSWORD }}
          BRANCH: >-
            ${{ fromJson('{
              "nightly": "daily",
              "rc": "staging",
              "exp": "staging",
              "production": "production"
            }')[github.event.inputs.releaseType] }}

      # Mints the release tag. Created via the API rather than git tag/push so the tag
      # lands on exactly ${{ github.sha }} and stays lightweight, matching every prior
      # tag - release-unity.yml checks out inputs.commit, which need not be github.sha.
      # Every downstream consumer (LightBeam aliases, the docs version table) keys off
      # this tag, not off the GitHub Release created below.
      - name: Create release tag
        if: ${{ inputs.dryRun == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/unity-sdk-${{ steps.version.outputs.VERSION }}" \
            -f sha="${{ github.sha }}"

      # A GitHub Release is created for production only. Nightly and RC tags stay bare:
      # a Release per preview build is what made the previous 999 of them noise. The
      # notes are a machine-generated verbatim slice of this version's CHANGELOG.md
      # section, for the lanes this workflow publishes - the same COPY_* lanes declared
      # for Publish Changelog above. Warns rather than fails on a missing section, so a
      # changelog nobody updated cannot red-X a release whose packages already shipped.
      - name: Create GitHub Release
        if: ${{ inputs.dryRun == false && inputs.releaseType == 'production' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          TAG: unity-sdk-${{ steps.version.outputs.VERSION }}
          COPY_UNITY_SDK: 'true'
          COPY_CLI: 'false'
          COPY_WEB_SDK: 'false'
        run: |
          bash ./build/bin/release-notes.sh
          gh release create "$TAG" \
            --title "Unity SDK ${{ steps.version.outputs.VERSION }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      # Tell beamable/docs to regenerate the SDK/CLI version table. This is the
      # only path that does so: the tag above is created with GITHUB_TOKEN, and
      # events raised by GITHUB_TOKEN never start a workflow run, so an
      # on-push-tags trigger cannot work here. Cross-repo dispatch needs a real
      # PAT; GITHUB_TOKEN is scoped to this repository and cannot reach docs.
      # --fail-with-body so an expired DOCS_DISPATCH_PAT fails the step loudly.
      - name: Notify docs of SDK release
        if: ${{ inputs.dryRun == false && inputs.releaseType == 'production' }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.DOCS_DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/beamable/docs/dispatches \
            -d '{
              "event_type": "unity-sdk-released",
              "client_payload": {
                "tag": "unity-sdk-${{ steps.version.outputs.VERSION }}",
                "sdk_version": "${{ steps.version.outputs.VERSION }}"
              }
            }'

      # Close the matching "Unity X.Y.Z" milestone once a production release ships.
      # Warns (does not fail) when no open milestone matches, so it never blocks a release. ~Claude
      - name: Close shipped milestone
        if: ${{ inputs.dryRun == false && inputs.releaseType == 'production' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Unity ${{ inputs.major }}.${{ inputs.minor }}.${{ inputs.patch }}"
          num=$(gh api "repos/${{ github.repository }}/milestones?state=open&per_page=100" \
                --jq ".[] | select(.title==\"$title\") | .number")
          if [ -n "$num" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/milestones/$num" -f state=closed
            echo "Closed milestone $title (#$num)"
          else
            echo "::warning::No open milestone titled '$title' to close"
          fi

  lightbeam:
    needs: package
    uses: ./.github/workflows/lightBeamRelease.yml
    with:
      customTag: unity-sdk-${{ needs.package.outputs.version }}
    secrets:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL_DEVOPS }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD_DEVOPS }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL_DEVOPS }}
      AWS_KEY_ID: ${{ secrets.AWS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_LIGHTBEAM_S3_BUCKET: ${{ secrets.AWS_LIGHTBEAM_S3_BUCKET }}
