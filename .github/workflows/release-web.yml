name: Web SDK Release

on:
  workflow_dispatch:
    inputs:
      commit:
        type: string
        description: Commit hash to deploy
        default: main
      major:
        type: number
        description: Major version number, X.0.0
        required: true
        default: 0
      minor:
        type: number
        description: Minor version number, 0.X.0
        required: true
        default: 0
      patch:
        type: number
        description: Patch version number, 0.0.X
        required: true
        default: 0
      rcNumber:
        type: number
        description: Rc version number, if required, 0.0.0-rc.X
        required: false
        default: 0
      releaseType:
        type: choice
        description: What type of release is this?
        required: true
        options:
          - nightly
          - rc
          - exp
          - production
      dryRun:
        type: boolean
        description: When true, no publish will happen
        required: true
        default: false

run-name: >-
  Release Web SDK ${{ inputs.releaseType }}
  ${{ inputs.major }}.${{ inputs.minor }}.${{ inputs.patch }}
  ${{ inputs.releaseType == 'rc' && format('-rc.{0}', inputs.rcNumber) || '' }}
  by @${{ github.actor }}

jobs:
  web-sdk-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install -g pnpm@10.8.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Compute version
        id: version
        run: |
          VERSION="${{ inputs.major }}.${{ inputs.minor }}.${{ inputs.patch }}"
          if [ "${{ inputs.releaseType }}" == "rc" ]; then
            VERSION="${VERSION}-rc.${{ inputs.rcNumber }}"
          elif [ "${{ inputs.releaseType }}" != "production" ]; then
            VERSION="${VERSION}-${{ inputs.releaseType }}"
          fi
          NPM_TAG="${{ inputs.releaseType }}"
          if [ "${{ inputs.releaseType }}" == "production" ]; then
            NPM_TAG="latest"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION (tag: $NPM_TAG)"

      - name: Set package version
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version

      # prepublishOnly runs build automatically
      - name: Publish to npm
        if: ${{ inputs.dryRun == false }}
        run: npm publish --no-git-checks --provenance --access public --tag ${{ steps.version.outputs.NPM_TAG }}

      # Mints the release tag. Created via the API rather than git tag/push so the tag
      # lands on exactly ${{ github.sha }} and stays lightweight, matching every prior
      # tag - release-unity.yml checks out inputs.commit, which need not be github.sha.
      # Every downstream consumer (LightBeam aliases, the docs version table) keys off
      # this tag, not off the GitHub Release created below.
      - name: Create release tag
        if: ${{ inputs.dryRun == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/web-sdk-${{ steps.version.outputs.VERSION }}" \
            -f sha="${{ github.sha }}"

      # A GitHub Release is created for production only. Nightly and RC tags stay bare:
      # a Release per preview build is what made the previous 999 of them noise. The
      # notes are a machine-generated verbatim slice of this version's CHANGELOG.md
      # section, for the lanes this workflow publishes - the same COPY_* lanes declared
      # for Publish Changelog above. Warns rather than fails on a missing section, so a
      # changelog nobody updated cannot red-X a release whose packages already shipped.
      - name: Create GitHub Release
        if: ${{ inputs.dryRun == false && inputs.releaseType == 'production' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          TAG: web-sdk-${{ steps.version.outputs.VERSION }}
          COPY_UNITY_SDK: 'false'
          COPY_CLI: 'false'
          COPY_WEB_SDK: 'true'
        run: |
          bash ./../build/bin/release-notes.sh
          gh release create "$TAG" --verify-tag \
            --title "Web SDK ${{ steps.version.outputs.VERSION }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Publish Changelog
        if: ${{ inputs.dryRun == false }}
        run: sh ./../build/bin/upload-changelogs.sh
        env:
          COPY_UNITY_SDK: 'false'
          COPY_CLI: 'false'
          COPY_WEB_SDK: 'true'
          VERSION: ${{ steps.version.outputs.VERSION }}
          GITHUB_USERNAME: ${{ secrets.GIT_CHANGELOGS_USERNAME }}
          GITHUB_PASSWORD: ${{ secrets.GIT_CHANGELOGS_PASSWORD }}
          BRANCH: >-
            ${{ fromJson('{
              "nightly": "daily",
              "rc": "staging",
              "exp": "staging",
              "production": "production"
            }')[github.event.inputs.releaseType] }}

      - name: Dry run build
        if: ${{ inputs.dryRun == true }}
        run: pnpm prepublishOnly
