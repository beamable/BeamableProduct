name: Web SDK Release

on:
  workflow_dispatch:
    inputs:
      commit:
        type: string
        description: Commit hash to deploy
        default: main
      major:
        type: number
        description: Major version number, X.0.0
        required: true
        default: 0
      minor:
        type: number
        description: Minor version number, 0.X.0
        required: true
        default: 0
      patch:
        type: number
        description: Patch version number, 0.0.X
        required: true
        default: 0
      rcNumber:
        type: number
        description: Rc version number, if required, 0.0.0-rc.X
        required: false
        default: 0
      releaseType:
        type: choice
        description: What type of release is this?
        required: true
        options:
          - dev
          - nightly
          - rc
          - exp
          - production
      dryRun:
        type: boolean
        description: When true, no publish will happen
        required: true
        default: false
      toolkitVersion:
        type: string
        description: Portal toolkit version to release on this SDK, X.Y.Z (empty skips the toolkit)
        required: false
        default: ''
      toolkitRcNumber:
        type: number
        description: Portal toolkit rc version number, if required, X.Y.Z-rc.N
        required: false
        default: 0
      updateExtensions:
        type: boolean
        description: After the toolkit release, open a PR in agentic-portal moving its extensions to it
        required: false
        default: false

run-name: >-
  Release Web SDK ${{ inputs.releaseType }}
  ${{ inputs.major }}.${{ inputs.minor }}.${{ inputs.patch }}
  ${{ inputs.releaseType == 'rc' && format('-rc.{0}', inputs.rcNumber) || '' }}
  by @${{ github.actor }}

jobs:
  web-sdk-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: write

    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install -g pnpm@10.8.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Compute version
        id: version
        run: |
          VERSION="${{ inputs.major }}.${{ inputs.minor }}.${{ inputs.patch }}"
          if [ "${{ inputs.releaseType }}" == "rc" ]; then
            VERSION="${VERSION}-rc.${{ inputs.rcNumber }}"
          elif [ "${{ inputs.releaseType }}" == "dev" ]; then
            VERSION="${VERSION}-dev.${{ github.run_number }}"
          elif [ "${{ inputs.releaseType }}" != "production" ]; then
            VERSION="${VERSION}-${{ inputs.releaseType }}"
          fi
          NPM_TAG="${{ inputs.releaseType }}"
          if [ "${{ inputs.releaseType }}" == "production" ]; then
            NPM_TAG="latest"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION (tag: $NPM_TAG)"
          # Checked before publishing, so a bad toolkit version can't leave the SDK released without it
          TOOLKIT_VERSION="${{ inputs.toolkitVersion }}"
          if [ -n "$TOOLKIT_VERSION" ] && ! [[ "$TOOLKIT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::toolkitVersion must be X.Y.Z, got '$TOOLKIT_VERSION'"
            exit 1
          fi

      - name: Set package version
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version

      # prepublishOnly runs build automatically
      - name: Publish to npm
        if: ${{ inputs.dryRun == false }}
        run: npm publish --no-git-checks --provenance --access public --tag ${{ steps.version.outputs.NPM_TAG }}

      - name: Create Release
        if: ${{ inputs.dryRun == false && inputs.releaseType != 'dev' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "web-sdk-${{ steps.version.outputs.VERSION }}" \
            --target "${{ github.sha }}" \
            --title "Web SDK ${{ steps.version.outputs.VERSION }}" \
            --notes "Web SDK Release ${{ steps.version.outputs.VERSION }}" \
            ${{ inputs.releaseType != 'production' && '--prerelease' || '' }}

      - name: Publish Changelog
        if: ${{ inputs.dryRun == false && inputs.releaseType != 'dev' }}
        run: sh ./../build/bin/upload-changelogs.sh
        env:
          COPY_UNITY_SDK: 'false'
          COPY_CLI: 'false'
          COPY_WEB_SDK: 'true'
          VERSION: ${{ steps.version.outputs.VERSION }}
          GITHUB_USERNAME: ${{ secrets.GIT_CHANGELOGS_USERNAME }}
          GITHUB_PASSWORD: ${{ secrets.GIT_CHANGELOGS_PASSWORD }}
          BRANCH: >-
            ${{ fromJson('{
              "nightly": "daily",
              "rc": "staging",
              "exp": "staging",
              "production": "production"
            }')[github.event.inputs.releaseType] }}

      - name: Dry run build
        if: ${{ inputs.dryRun == true }}
        run: pnpm prepublishOnly

      # A dispatch (not a workflow_call) so the toolkit publishes under its own workflow, the one npm trusts for it
      - name: Release the portal toolkit
        if: ${{ inputs.dryRun == false && inputs.toolkitVersion != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOOLKIT_VERSION: ${{ inputs.toolkitVersion }}
        run: |
          IFS=. read -r MAJOR MINOR PATCH <<< "$TOOLKIT_VERSION"
          gh workflow run release-portal-toolkit.yml --ref "${{ github.ref_name }}" \
            -f commit="${{ inputs.commit }}" \
            -f major="$MAJOR" -f minor="$MINOR" -f patch="$PATCH" \
            -f rcNumber="${{ inputs.toolkitRcNumber }}" \
            -f releaseType="${{ inputs.releaseType }}" \
            -f dryRun=false \
            -f sdkVersion="${{ steps.version.outputs.VERSION }}" \
            -f updateExtensions="${{ inputs.updateExtensions }}"
          echo "Dispatched the portal toolkit release $TOOLKIT_VERSION on @beamable/sdk ${{ steps.version.outputs.VERSION }}"
