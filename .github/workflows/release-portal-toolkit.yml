name: Portal Toolkit Release

on:
  workflow_dispatch:
    inputs:
      commit:
        type: string
        description: Commit hash to deploy
        default: main
      major:
        type: number
        description: Major version number, X.0.0
        required: true
        default: 0
      minor:
        type: number
        description: Minor version number, 0.X.0
        required: true
        default: 0
      patch:
        type: number
        description: Patch version number, 0.0.X
        required: true
        default: 0
      rcNumber:
        type: number
        description: Rc version number, if required, 0.0.0-rc.X
        required: false
        default: 0
      releaseType:
        type: choice
        description: What type of release is this?
        required: true
        options:
          - dev
          - nightly
          - rc
          - exp
          - production
      dryRun:
        type: boolean
        description: When true, no publish will happen
        required: true
        default: false
      sdkVersion:
        type: string
        description: '@beamable/sdk version to pin the toolkit to (empty keeps the committed one)'
        required: false
        default: ''
      updateExtensions:
        type: boolean
        description: After publishing, open a PR in agentic-portal moving its extensions to this toolkit
        required: false
        default: false

run-name: >-
  Release Portal Toolkit ${{ inputs.releaseType }}
  ${{ inputs.major }}.${{ inputs.minor }}.${{ inputs.patch }}
  ${{ inputs.releaseType == 'rc' && format('-rc.{0}', inputs.rcNumber) || '' }}
  by @${{ github.actor }}

jobs:
  portal-toolkit-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      SDK_VERSION: ${{ inputs.sdkVersion }}
      HAS_PORTAL_TOKEN: ${{ secrets.AGENTIC_PORTAL_TOKEN != '' }}
    defaults:
      run:
        working-directory: beam-portal-toolkit
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.commit }}

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install -g pnpm@10.8.0

      - name: Pin @beamable/sdk
        if: ${{ inputs.sdkVersion != '' }}
        run: |
          # A chained run starts right after the SDK publish; give the registry a few minutes to serve it
          for i in $(seq 1 30); do
            npm view "@beamable/sdk@$SDK_VERSION" version > /dev/null 2>&1 && break
            echo "Waiting for @beamable/sdk@$SDK_VERSION on npm ($i/30)"
            sleep 10
          done
          npm view "@beamable/sdk@$SDK_VERSION" version
          npm pkg set "peerDependencies.@beamable/sdk=$SDK_VERSION" "devDependencies.@beamable/sdk=$SDK_VERSION"

      - name: Install dependencies
        run: pnpm install ${{ inputs.sdkVersion != '' && '--no-frozen-lockfile' || '--frozen-lockfile' }}

      - name: Check out agentic-portal's components
        if: ${{ env.HAS_PORTAL_TOKEN == 'true' }}
        uses: actions/checkout@v5
        with:
          repository: beamable/agentic-portal
          token: ${{ secrets.AGENTIC_PORTAL_TOKEN }}
          path: agentic-portal
          sparse-checkout: custom-elements.json
          sparse-checkout-cone-mode: false

      - name: Sync components
        run: |
          if [ "$HAS_PORTAL_TOKEN" == "true" ]; then
            PORTAL_REPO_PATH="$GITHUB_WORKSPACE/agentic-portal" pnpm sync-components
          else
            echo "::warning::AGENTIC_PORTAL_TOKEN is not set: releasing the committed custom-elements.json"
          fi

      - name: Compute version
        id: version
        run: |
          echo "BASE_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          VERSION="${{ inputs.major }}.${{ inputs.minor }}.${{ inputs.patch }}"
          if [ "${{ inputs.releaseType }}" == "rc" ]; then
            VERSION="${VERSION}-rc.${{ inputs.rcNumber }}"
          elif [ "${{ inputs.releaseType }}" == "dev" ]; then
            VERSION="${VERSION}-dev.${{ github.run_number }}"
          elif [ "${{ inputs.releaseType }}" != "production" ]; then
            VERSION="${VERSION}-${{ inputs.releaseType }}"
          fi
          NPM_TAG="${{ inputs.releaseType }}"
          if [ "${{ inputs.releaseType }}" == "production" ]; then
            NPM_TAG="latest"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION (tag: $NPM_TAG)"

      - name: Set package version
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version

      # prepublishOnly runs sync-components --no-copy && build automatically
      - name: Publish to npm
        if: ${{ inputs.dryRun == false }}
        run: npm publish --provenance --access public --tag ${{ steps.version.outputs.NPM_TAG }}

      - name: Dry run build
        if: ${{ inputs.dryRun == true }}
        run: npm run prepublishOnly

      # The SDK pin and the components are what a release used to need a commit for; hand them back as a PR
      - name: Open a PR with the release's changes
        if: ${{ inputs.dryRun == false && inputs.releaseType != 'dev' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          npm pkg set version="${{ steps.version.outputs.BASE_VERSION }}"
          if git diff --quiet -- package.json pnpm-lock.yaml custom-elements.json src/generated; then
            echo "Nothing changed in the repo"
            exit 0
          fi
          BRANCH="toolkit-release/$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json pnpm-lock.yaml custom-elements.json src/generated
          git commit -m "change: Portal toolkit $VERSION pins @beamable/sdk $(node -p "require('./package.json').peerDependencies['@beamable/sdk']") and agentic-portal's components"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Portal toolkit $VERSION" \
            --body "What the portal toolkit $VERSION release published with: its \`@beamable/sdk\` pin and the components synced from agentic-portal."

      - name: Update agentic-portal's extensions
        if: ${{ inputs.dryRun == false && inputs.updateExtensions }}
        env:
          GH_TOKEN: ${{ secrets.AGENTIC_PORTAL_TOKEN }}
        run: |
          if [ "$HAS_PORTAL_TOKEN" != "true" ]; then
            echo "::error::updateExtensions needs the AGENTIC_PORTAL_TOKEN secret"
            exit 1
          fi
          gh workflow run update-portal-toolkit.yml -R beamable/agentic-portal \
            -f toolkitVersion="${{ steps.version.outputs.VERSION }}" \
            -f sdkVersion="$(node -p "require('./package.json').peerDependencies['@beamable/sdk']")"
